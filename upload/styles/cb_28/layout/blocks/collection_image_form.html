<div class="formSection clear">
    <h4>{lang('default_x', lang($image_type))|ucfirst} <i class="glyphicon glyphicon-chevron-down pull-right"></i></h4>
    <div class="sectionContent hidden">
        {if $image_type == 'backdrop' && !empty($other_fields['use_backdrop_as_default_thumb'])}
            <br/>
            {$formObj->createField($other_fields['use_backdrop_as_default_thumb'])}
            <hr/>
        {/if}
        <div class="row" style="margin-left: 5px; margin-right: 5px;">
            {foreach from=$images item=image}
                <div class="col-md-3">
                    <div class="form-group text-center">
                        <label for="collection_{$image_type}_{$image.id_collection_image}">
                            <img class="edit-img-thumbnail" src="{CollectionThumbs::getImageFile($image, $thumb_width)|escape:'html'}" width="{$image_width}" height="{$image_height}"/>
                            <input class="show" style="margin:5px auto;" type="radio" value="{$image.id_collection_image}" id="collection_{$image_type}_{$image.id_collection_image}" name="default_{$image_type}" {if $c["default_{$image_type}"] == $image.id_collection_image}checked{/if}/>
                        </label>
                    </div>
                </div>
            {/foreach}
        </div>
        <div style="clear: both;"></div>
        <div class="row" style="margin-left: 5px; margin-right: 5px;">
            <h5><label for="new_collection_{$image_type}">{lang("upload_{$image_type}")}</label></h5>
            <input name="collection_{$image_type}[]" id="new_collection_{$image_type}" type="file" accept="image/*"
                {if !Update::IsCurrentDBVersionIsHigherOrEqualTo('5.5.3', '999')} disabled="disabled"{/if}/>
            <div class="form-group pull-right">
                <input type="submit" name="update_collection" value="{lang code='upload'}" class="btn btn-primary btn-sm"
                    {if !Update::IsCurrentDBVersionIsHigherOrEqualTo('5.5.3', '999')} disabled="disabled" title="{lang('cant_perform_action_until_app_fully_updated')}"{/if}/>
            </div>
        </div>
    </div>
</div>
